import org.jetbrains.kotlin.gradle.dsl.JvmTarget
import org.jetbrains.kotlin.gradle.dsl.KotlinVersion

buildscript {
  ext {
      kotlin_version = '2.2.0'
  }
    repositories {
    mavenCentral()
    google()
  }
  dependencies {
    classpath 'com.android.tools.build:gradle:8.13.2'
    classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    classpath "androidx.navigation:navigation-safe-args-gradle-plugin:2.9.6"
  }
}

allprojects {
  repositories {
    mavenCentral()
    google()
  }
}

apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'
apply plugin: 'androidx.navigation.safeargs'

android {
    kotlin {
        compilerOptions {
            // Configure common compiler options for all targets
            jvmTarget.set(JvmTarget.JVM_1_8)
            languageVersion.set(KotlinVersion.KOTLIN_2_0) // Specify Kotlin language version
            allWarningsAsErrors.set(false) // Treat all warnings as errors
            freeCompilerArgs.addAll("-opt-in=kotlin.RequiresOptIn", "-Xinline-classes") // Add extra compiler arguments
        }
    }
    compileSdkVersion 36

    defaultConfig {
        applicationId "net.quedale.andronvif"
        minSdkVersion 24
        targetSdkVersion 36
        versionCode 1
        versionName "1.0"

        externalNativeBuild {
            cmake {
                def subprojectsRoot = null
                if (project.hasProperty('subprojectsDirectory'))
                    subprojectsRoot = project.subprojectsDirectory
                // Convert relative path into absolute
                if(subprojectsRoot != null){
                    def subprojectFolder = file(subprojectsRoot)
                    subprojectsRoot = subprojectFolder.absolutePath
                    subprojectsRoot = "-DSUBPROJECTS_ROOT=${subprojectsRoot}"
                }

                def gstRoot
                if (project.hasProperty('gstAndroidRoot'))
                    gstRoot = project.gstAndroidRoot
                else
                    gstRoot = System.env.GSTREAMER_ROOT_ANDROID
                // Convert relative path into absolute
                if(gstRoot != null) {
                    def gstFolder = file(gstRoot)
                    gstRoot = gstFolder.absolutePath
                    gstRoot = "-DGSTREAMER_ROOT_ANDROID=${gstRoot}"
                }

                arguments "-DCMAKE_VERBOSE_MAKEFILE=ON"
                arguments.add("-DANDROID_STL=c++_shared")
                if(subprojectsRoot != null)
                    arguments.add("${subprojectsRoot}")
                if(gstRoot != null)
                    arguments.add("${gstRoot}")
                arguments.add("-GNinja")
                targets "andronvif"

                // All archs except MIPS and MIPS64 are supported
                abiFilters 'x86_64'
                //abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64'
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            sourceSets {
                main {
                    manifest.srcFile 'AndroidManifest.xml'
                    java.srcDirs = ['src']
                    resources.srcDirs = ['src']
                    aidl.srcDirs = ['src']
                    res.srcDirs = ['res']
                    assets.srcDirs = ['assets'] //Generated by gstreamer
                }
            }
        }
    }

    externalNativeBuild {
        cmake {
            path 'jni/CMakeLists.txt'
        }
    }
    ndkVersion = '25.2.9519653'
    namespace = 'net.quedale.andronvif'

    buildFeatures {
        aidl = true
        viewBinding = true
    }
}

dependencies {
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.navigation:navigation-fragment:2.9.3'
    implementation 'androidx.navigation:navigation-ui:2.9.3'
    implementation 'androidx.work:work-runtime:2.10.3'

    implementation("org.jetbrains.kotlinx:kotlinx-coroutines-core:1.10.2") // Check for the latest version
    implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2") // Check for the latest version
    // ViewModelScope and LifecycleScope (add the ktx dependencies)
    implementation("androidx.lifecycle:lifecycle-viewmodel-ktx:2.10.0")
    implementation("androidx.lifecycle:lifecycle-runtime-ktx:2.10.0")
    implementation 'androidx.core:core-ktx:1.17.0'
//    testImplementation 'junit:junit:4.13.2'
//    implementation 'com.android.support:appcompat-v7:28.0.0'
}
